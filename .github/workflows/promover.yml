# Promoção dev -> prod: copia a imagem (tag + DIGEST) que está em dev para prod e abre um PR.
# Não reconstrói nada: o que vai para prod é exatamente o artefato testado em dev.
# O merge em prod pede aprovação (CODEOWNERS + proteção de branch).
name: promover

on:
  workflow_dispatch:

permissions: {}

jobs:
  promover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ler a versão de dev
        id: dev
        run: |
          echo "tag=$(yq '.imagem.tag' gitops/ambientes/dev/creditflow.yaml)" >> "$GITHUB_OUTPUT"
          echo "digest=$(yq '.imagem.digest' gitops/ambientes/dev/creditflow.yaml)" >> "$GITHUB_OUTPUT"
      - name: copiar para prod
        run: |
          test -n "${{ steps.dev.outputs.digest }}" || { echo "dev sem digest: nada a promover"; exit 1; }
          yq -i '.imagem.tag = "${{ steps.dev.outputs.tag }}" | .imagem.digest = "${{ steps.dev.outputs.digest }}"' \
            gitops/ambientes/prod/creditflow.yaml
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: deploy/prod
          delete-branch: true
          commit-message: "deploy(prod): creditflow ${{ steps.dev.outputs.tag }}"
          title: "deploy(prod): creditflow ${{ steps.dev.outputs.tag }}"
          body: |
            Promove para produção o digest que está rodando em dev:
            `${{ steps.dev.outputs.digest }}`
            Antes do merge: SLOs de dev verdes nas últimas 24 h? Migração compatível com a versão anterior?
          labels: deploy,prod
