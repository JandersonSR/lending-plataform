# CI do CreditFlow: build e teste .NET -> imagem -> Trivy -> push no Harbor (robô) ->
# assinatura keyless (cosign) -> PR que atualiza a imagem de DEV no gitops.
# Explicação passo a passo: curso CreditFlow, módulo 10 (cadeia de suprimentos) e 11 (GitOps).
#
# Configuração no GitHub (Settings > Secrets and variables > Actions):
#   vars.HARBOR_HOST            harbor.seudominio.com.br
#   vars.HARBOR_ROBO_PUSH       robot$creditflow+ci          (não é segredo: é um nome)
#   secrets.HARBOR_ROBO_TOKEN   token do robô de push (só push/pull no projeto creditflow)
#
# Ações fixadas por SHA de commit, não por tag: em mar/2026 tags do aquasecurity/trivy-action
# foram reescritas por um atacante e milhares de workflows rodaram código malicioso (lição 10.1).
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "gitops/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "gitops/**", "**.md"]

# Por padrão o GITHUB_TOKEN não pode nada; cada job pede só o que usa.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGEM: ${{ vars.HARBOR_HOST }}/creditflow/creditflow
  TRIVY_VERSAO: "0.76.1"

jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"
      - name: restore
        run: dotnet restore CreditFlow.slnx
      - name: build
        run: dotnet build CreditFlow.slnx -c Release --no-restore
      # Testcontainers usa o Docker do runner (Postgres, Mongo, Kafka, Dragonfly reais).
      - name: testes
        run: dotnet test CreditFlow.slnx -c Release --no-build
      - name: cópias de DDL e realm em dia nos charts
        run: deploy/scripts/copiar-artefatos.sh --verificar

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # token OIDC para a assinatura keyless do cosign
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      versao: ${{ steps.versao.outputs.versao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: versão
        id: versao
        run: echo "versao=0.1.${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # 1) Constrói e carrega LOCALMENTE (sem push): o scan vem antes de a imagem sair do runner.
      - name: build (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          push: false
          tags: creditflow:scan
          build-args: |
            VERSAO=${{ steps.versao.outputs.versao }}
            REVISAO=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Trivy direto do binário oficial, versão fixa. Reprova CRITICAL/HIGH que TÊM correção:
      #    vulnerabilidade sem correção publicada não reprova (não há o que fazer além de registrar).
      - name: instalar trivy
        run: |
          curl -sSfL -o trivy.deb \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSAO}/trivy_${TRIVY_VERSAO}_Linux-64bit.deb"
          curl -sSfL -o checksums.txt \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSAO}/trivy_${TRIVY_VERSAO}_checksums.txt"
          grep "trivy_${TRIVY_VERSAO}_Linux-64bit.deb" checksums.txt | sha256sum -c -
          sudo dpkg -i trivy.deb
      - name: scan da imagem
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile deploy/docker/.trivyignore --format table creditflow:scan
      - name: SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json creditflow:scan

      - name: parar aqui em PR
        if: github.event_name == 'pull_request'
        run: echo "Pull request - imagem construída e escaneada; push só na main."

      # 3) Push no Harbor com o robô de CI (só push/pull no projeto creditflow).
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: github.event_name == 'push'
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ vars.HARBOR_ROBO_PUSH }}
          password: ${{ secrets.HARBOR_ROBO_TOKEN }}
      - name: build e push
        id: build
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGEM }}:${{ steps.versao.outputs.versao }}
            ${{ env.IMAGEM }}:sha-${{ github.sha }}
          build-args: |
            VERSAO=${{ steps.versao.outputs.versao }}
            REVISAO=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      # 4) Assinatura keyless POR DIGEST: o certificado efêmero do Fulcio carrega a identidade
      #    do workflow (repo, arquivo, ref); o registro vai para o log público Rekor.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'
      - name: assinar
        if: github.event_name == 'push'
        run: |
          cosign sign --yes "${IMAGEM}@${{ steps.build.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGEM}@${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom
          path: sbom.cdx.json

  promover-dev:
    # Não faz deploy: abre um PR no gitops. Quem aplica é o Argo CD (pull).
    if: github.event_name == 'push'
    needs: imagem
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4
        with:
          cmd: >-
            yq -i '.imagem.tag = "${{ needs.imagem.outputs.versao }}" |
                   .imagem.digest = "${{ needs.imagem.outputs.digest }}"'
            gitops/ambientes/dev/creditflow.yaml
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: deploy/dev
          delete-branch: true
          commit-message: "deploy(dev): creditflow ${{ needs.imagem.outputs.versao }}"
          title: "deploy(dev): creditflow ${{ needs.imagem.outputs.versao }}"
          body: |
            Imagem `${{ env.IMAGEM }}@${{ needs.imagem.outputs.digest }}`
            Commit: ${{ github.sha }} · build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Ao fazer merge, o Argo CD de dev sincroniza sozinho.
          labels: deploy,dev
