# Chart grafana/loki 7.x em modo monolítico (um binário). Suficiente para dev e prod pequeno;
# para volume maior: SimpleScalable com Azure Blob como armazenamento de objetos.
deploymentMode: SingleBinary
fullnameOverride: loki
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # Necessário para a ingestão OTLP guardar atributos como metadados estruturados.
    allow_structured_metadata: true
    retention_period: 168h
singleBinary:
  replicas: 1
  persistence:
    size: 30Gi
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
