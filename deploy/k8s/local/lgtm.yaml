# Observabilidade local num contêiner só: grafana/otel-lgtm (Grafana + Loki + Tempo + Prometheus
# + um OpenTelemetry Collector recebendo OTLP em 4317/4318).
# Grafana: kubectl -n observabilidade port-forward svc/lgtm 3000:3000  (admin/admin)
apiVersion: v1
kind: Namespace
metadata:
  name: observabilidade
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: observabilidade
spec:
  replicas: 1
  selector:
    matchLabels: { app: lgtm }
  template:
    metadata:
      labels: { app: lgtm }
    spec:
      containers:
        - name: lgtm
          image: docker.io/grafana/otel-lgtm:0.39.0
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: observabilidade
spec:
  selector: { app: lgtm }
  ports:
    - { name: grafana, port: 3000, targetPort: grafana }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
