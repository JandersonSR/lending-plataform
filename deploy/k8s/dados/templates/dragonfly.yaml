{{- /*
Dragonfly (compatível com o protocolo do Redis) via operador. O operador cria o
StatefulSet, elege o primário e mantém o Service "<nome>" apontando sempre para ele.
É CACHE: sem snapshot, com cache_mode (despeja chaves perto do limite em vez de recusar escrita).
*/ -}}
{{- $d := .Values.dragonfly }}
{{- if $d.senhaDoCofre }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $d.nome }}-senha
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: {{ $d.nome }}-senha
    creationPolicy: Owner
  data:
    - secretKey: senha
      remoteRef:
        key: dragonfly-senha
---
{{- end }}
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: {{ $d.nome }}
spec:
  replicas: {{ $d.replicas }}
  {{- with $d.imagem }}
  image: {{ . }}
  {{- end }}
  args:
    - --cache_mode=true
    - --maxmemory={{ $d.memoriaMaxima }}
    - --proactor_threads=2
  resources:
    {{- toYaml $d.recursos | nindent 4 }}
  {{- if $d.senhaDoCofre }}
  authentication:
    passwordFromSecret:
      name: {{ $d.nome }}-senha
      key: senha
  {{- end }}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: {{ $d.nome }}
