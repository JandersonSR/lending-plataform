{{- /*
Autoescala por perfil:
  hpa  -> HorizontalPodAutoscaler por CPU (api-simulacao é CPU-bound)
  keda -> ScaledObject do KEDA pelo lag do grupo de consumidores no Kafka (worker-pagamentos)
O KEDA também cria um HPA por baixo; NUNCA declare os dois para o mesmo Deployment.
*/ -}}
{{- range $nome, $p := .Values.perfis }}
{{- if and $p.habilitado $p.autoescala }}
{{- $ctx := dict "raiz" $ "perfil" $nome "cfg" $p }}
{{- $a := $p.autoescala }}
{{- if eq $a.tipo "hpa" }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "creditflow.nomePerfil" $ctx }}
  labels:
    {{- include "creditflow.rotulosPerfil" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "creditflow.nomePerfil" $ctx }}
  minReplicas: {{ $a.minimo }}
  maxReplicas: {{ $a.maximo }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Porcentagem do REQUEST de CPU, não do limite (lição 7.3).
          averageUtilization: {{ $a.cpuAlvo }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
{{- else if eq $a.tipo "keda" }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "creditflow.nomePerfil" $ctx }}
  labels:
    {{- include "creditflow.rotulosPerfil" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "creditflow.nomePerfil" $ctx }}
  minReplicaCount: {{ $a.minimo }}
  maxReplicaCount: {{ $a.maximo }}
  pollingInterval: {{ $a.pollingInterval | default 15 }}
  cooldownPeriod: {{ $a.cooldownPeriod | default 120 }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ $a.kafka.bootstrapServers | quote }}
        consumerGroup: {{ $a.kafka.grupo | quote }}
        topic: {{ $a.kafka.topico | quote }}
        lagThreshold: {{ $a.kafka.lagLimite | quote }}
        offsetResetPolicy: earliest
      authenticationRef:
        name: {{ include "creditflow.nomePerfil" $ctx }}-kafka
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "creditflow.nomePerfil" $ctx }}-kafka
  labels:
    {{- include "creditflow.rotulosPerfil" $ctx | nindent 4 }}
spec:
  secretTargetRef:
    {{- $segredo := include "creditflow.nomeSegredo" (dict "raiz" $ "item" $a.kafka.segredo) }}
    {{- range list "sasl" "username" "password" "tls" "ca" }}
    - parameter: {{ . }}
      name: {{ $segredo }}
      key: {{ . }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
