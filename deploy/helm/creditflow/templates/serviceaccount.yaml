{{- /*
Uma ServiceAccount por perfil. Com Workload Identity, cada uma vira um "subject" de
credencial federada no Entra ID (system:serviceaccount:<ns>:<release>-<perfil>), e dá
para conceder a cada perfil só o que ele usa (lição 9.4).
*/ -}}
{{- range $nome, $p := .Values.perfis }}
{{- if $p.habilitado }}
{{- $ctx := dict "raiz" $ "perfil" $nome "cfg" $p }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "creditflow.nomePerfil" $ctx }}
  labels:
    {{- include "creditflow.rotulosPerfil" $ctx | nindent 4 }}
  {{- if $.Values.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ $.Values.workloadIdentity.clientId | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
