{{- /*
Um Deployment por perfil habilitado. A imagem é a mesma; mudam CREDITFLOW__MODULOS,
CREDITFLOW__PAPEL, segredos, recursos, sondas e escala.

Atenção ao "mergeOverwrite": ele NÃO sobrescreve com valores zero (0, false, ""),
por isso os campos que o perfil pode zerar são lidos com hasKey (lição 7.2).
*/ -}}
{{- range $nome, $p := .Values.perfis }}
{{- if $p.habilitado }}
{{- $ctx := dict "raiz" $ "perfil" $nome "cfg" $p }}
{{- $padrao := $.Values.padrao }}
{{- $tipoEscala := "nenhum" }}
{{- if $p.autoescala }}{{ $tipoEscala = default "nenhum" $p.autoescala.tipo }}{{ end }}
{{- $preStop := $padrao.preStopSegundos }}
{{- if hasKey $p "preStopSegundos" }}{{ $preStop = $p.preStopSegundos }}{{ end }}
{{- $grace := $padrao.terminationGracePeriodSeconds }}
{{- if hasKey $p "terminationGracePeriodSeconds" }}{{ $grace = $p.terminationGracePeriodSeconds }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "creditflow.nomePerfil" $ctx }}
  labels:
    {{- include "creditflow.rotulosPerfil" $ctx | nindent 4 }}
spec:
  {{- if eq $tipoEscala "nenhum" }}
  # Sem autoescala, o chart declara as réplicas. Com HPA/KEDA, NÃO declara:
  # senão o Argo CD (selfHeal) e o autoescalador brigam pelo campo.
  replicas: {{ $p.replicas | default 1 }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "creditflow.seletorPerfil" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "creditflow.rotulosPerfil" $ctx | nindent 8 }}
        {{- if $.Values.workloadIdentity.clientId }}
        azure.workload.identity/use: "true"
        {{- end }}
        {{- with (default $padrao.podRotulos $p.podRotulos) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Muda quando o ConfigMap muda: força o rollout (env só é lida quando o processo sobe).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with (default $padrao.podAnotacoes $p.podAnotacoes) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "creditflow.nomePerfil" $ctx }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $grace }}
      {{- with $.Values.imagem.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      {{- with (default $padrao.nodeSelector $p.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default $padrao.tolerations $p.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $padrao.spreadPorZona }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "creditflow.seletorPerfil" $ctx | nindent 14 }}
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "creditflow.seletorPerfil" $ctx | nindent 14 }}
          matchLabelKeys: [pod-template-hash]
      {{- end }}
      containers:
        - name: creditflow
          image: {{ include "creditflow.imagem" $ | quote }}
          imagePullPolicy: {{ $.Values.imagem.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CREDITFLOW__MODULOS
              value: {{ include "creditflow.modulos" $p.modulos | quote }}
            - name: CREDITFLOW__PAPEL
              value: {{ $p.papel | quote }}
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ $.Values.ambiente | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "creditflow-%s" $nome | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.namespace=creditflow,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.deployment.name=%s" (include "creditflow.nomePerfil" $ctx) | quote }}
            {{- range $k, $v := $p.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "creditflow.nome" $ }}-config
            {{- range $p.segredos }}
            - secretRef:
                name: {{ include "creditflow.nomeSegredo" (dict "raiz" $ "item" .) }}
            {{- end }}
          startupProbe:
            {{- include "creditflow.sonda" $p.sondas.startup | nindent 12 }}
          readinessProbe:
            {{- include "creditflow.sonda" $p.sondas.readiness | nindent 12 }}
          livenessProbe:
            {{- include "creditflow.sonda" $p.sondas.liveness | nindent 12 }}
          {{- if gt (int $preStop) 0 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $preStop }}
          {{- end }}
          resources:
            {{- toYaml $p.recursos | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
{{- end }}
